<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aXis - Vector Database</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23000000'/><text x='50' y='65' font-size='48' font-weight='bold' font-family='Courier New, monospace' fill='%2300d4ff' text-anchor='middle'>aXis</text></svg>"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- HAMBURGER MENU -->
    <div class="hamburger-menu" id="hamburgerMenu">
      <div class="menu-header">
        <div class="menu-title">Menu</div>
      </div>
      <div class="menu-item" id="insertMenuItem">📝 Insert Data</div>
      <div class="menu-item" id="dbSelectorMenuItem">🗄️ Select Database</div>
    </div>

    <!-- HAMBURGER TOGGLE -->
    <div class="hamburger-toggle" id="hamburgerToggle">
      <div class="hamburger-line"></div>
      <div class="hamburger-line"></div>
      <div class="hamburger-line"></div>
    </div>

    <!-- INSERT MODAL -->
    <div class="modal" id="insertModal">
      <div class="modal-content">
        <div class="modal-header">Insert New Data</div>
        <div class="form-group">
          <label class="form-label">Text Content</label>
          <textarea
            class="form-input form-textarea"
            id="insertText"
            placeholder="Enter the text to insert..."
          ></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Payload</label>
          <textarea
            class="form-input form-textarea"
            id="insertPayload"
            placeholder="Enter the answer or payload text..."
          ></textarea>
        </div>
        <div id="insertMessage"></div>
        <div class="modal-buttons">
          <button class="modal-btn submit" id="insertSubmitBtn">Insert</button>
          <button class="modal-btn cancel" id="insertCancelBtn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- DATABASE SELECTOR MODAL -->
    <div class="modal" id="dbModal">
      <div class="modal-content">
        <div class="modal-header">Select Database</div>
        <div class="form-group">
          <label class="form-label">Available Databases</label>
          <select class="form-input" id="dbSelect">
            <option value="">Loading...</option>
          </select>
        </div>
        <div id="dbMessage"></div>
        <div class="modal-buttons">
          <button class="modal-btn submit" id="dbLoadBtn">Load</button>
          <button class="modal-btn cancel" id="dbCancelBtn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- SPLASH SCREEN -->
    <div class="splash-screen">
      <div class="logo-container">
        <div class="glow-ring"></div>
        <div class="glow-ring"></div>
        <div class="axis-logo">aXis</div>
      </div>
    </div>

    <!-- MAIN INTERFACE -->
    <div class="main-interface">
      <div class="container">
        <!-- Header -->
        <div class="header">
          <h1 class="title">aXis</h1>
          <p class="subtitle">VECTOR SEARCH ENGINE</p>
        </div>

        <!-- Search Box -->
        <div class="search-container">
          <div class="search-input-wrapper">
            <input
              type="text"
              class="search-input"
              id="searchInput"
              placeholder="Enter your query..."
              autocomplete="off"
            />
            <button class="search-btn" id="searchBtn">Search</button>
          </div>
        </div>

        <!-- Results -->
        <div class="results-container" id="resultsContainer"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
